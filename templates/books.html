                <script>
                    let allBooks = [];

        async function loadBooks() {
            try {
                const res = await fetch('http://localhost:3000/api/books.php');
                if (!res.ok) throw new Error('API error');
                const data = await res.json();
                allBooks = Array.isArray(data) ? data : (data.books || data.items || []);
            } catch (e) {
                console.warn('API failed, loading fallback JSON', e.message);
                try {
                    const fallback = await fetch('http://localhost:5500/data/library.json');
                    const json = await fallback.json();
                    allBooks = json.books || [];
                } catch (err) {
                    console.error('Fallback failed', err);
                    allBooks = [];
                }
            }
            renderBooks(allBooks);
        }                    function makeBookCard(book) {
                        const isbn = book.isbn || book.ISBN || '';
                        const cover = book.cover || book.image || '../images/product-item1.jpg';
                        const title = book.title || book.Title || 'Untitled';
                        const author = book.author || book.Author || (book.authors || 'Unknown');
                        const availability = (book.status || book.Status || (book.available ? 'Available' : 'Checked Out'));
                        const encodedIsbn = encodeURIComponent(isbn);

                        return `
                            <div class="col-md-3 mb-4">
                                <div class="product-item">
                                    <figure class="product-style">
                                        <a href="book-details.html?isbn=${encodedIsbn}">
                                            <img src="${cover}" alt="${title}" class="product-item img-fluid">
                                        </a>
                                        <button type="button" class="add-to-cart" onclick="window.location.href='book-details.html?isbn=${encodedIsbn}'">View Details</button>
                                    </figure>
                                    <figcaption>
                                        <h3>${title}</h3>
                                        <span>${author}</span>
                                        <div class="item-price"><span class="badge ${availability.toLowerCase().includes('available') ? 'bg-success' : 'bg-secondary'}">${availability}</span></div>
                                        <div class="small text-muted">ISBN: ${isbn || 'N/A'}</div>
                                    </figcaption>
                                </div>
                            </div>
                        `;
                    }

                    function renderBooks(books) {
                        const container = document.getElementById('booksGrid');
                        container.innerHTML = '';
                        if (!books || !books.length) {
                            container.innerHTML = '<p class="text-muted">No books found.</p>';
                            return;
                        }
                        const html = books.map(makeBookCard).join('\n');
                        container.innerHTML = html;
                    }

                    function filterBooks() {
                        const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
                        const type = document.getElementById('searchType').value;
                        const category = document.getElementById('categoryFilter').value;

                        const filtered = allBooks.filter(book => {
                            // category match
                            if (category && ((book.category || '') !== category)) return false;

                            if (!q) return true;

                            const title = (book.title || book.Title || '').toString().toLowerCase();
                            const author = (book.author || book.Author || (book.authors || '')).toString().toLowerCase();
                            const isbn = (book.isbn || book.ISBN || '').toString().toLowerCase();

                            if (type === 'isbn') return isbn.includes(q);
                            if (type === 'title') return title.includes(q);
                            if (type === 'author') return author.includes(q);
                            // default: title_or_author
                            return title.includes(q) || author.includes(q) || isbn.includes(q);
                        });

                        renderBooks(filtered);
                    }

                    document.addEventListener('DOMContentLoaded', function () {
                        loadBooks();
                        document.getElementById('searchForm').addEventListener('submit', function (e) {
                            e.preventDefault();
                            filterBooks();
                        });
                        document.getElementById('searchInput').addEventListener('input', filterBooks);
                        document.getElementById('searchType').addEventListener('change', filterBooks);
                        document.getElementById('categoryFilter').addEventListener('change', filterBooks);
                    });
                </script>
            </body>

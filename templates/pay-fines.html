<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pay Fines - Library</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="../css/style.css">
</head>

<body>
    <div class="container py-5">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <div class="card">
                    <div class="card-header">
                        <h4>Pay Fines</h4>
                    </div>
                    <div class="card-body">
                        <p>Your outstanding fines are listed below. Select the ones you want to pay.</p>
                        <table class="table table-striped">
                            <thead>
                                <tr>
                                    <th></th>
                                    <th>Reason</th>
                                    <th>Amount</th>
                                    <th>Date</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td><input type="checkbox" class="fine-checkbox" data-amount="2.50"></td>
                                    <td>Late return - Book A</td>
                                    <td>$2.50</td>
                                    <td>2025-04-10</td>
                                </tr>
                                <tr>
                                    <td><input type="checkbox" class="fine-checkbox" data-amount="5.00"></td>
                                    <td>Damaged - Book B</td>
                                    <td>$5.00</td>
                                    <td>2025-03-02</td>
                                </tr>
                            </tbody>
                        </table>

                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <div>
                                <strong>Total:</strong> <span id="totalAmount">$0.00</span>
                            </div>
                            <div>
                                <button id="payBtn" class="btn btn-primary">Pay Selected</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(function () {
            function updateTotal() {
                let total = 0;
                $('.fine-checkbox:checked').each(function () {
                    total += parseFloat($(this).data('amount'));
                });
                $('#totalAmount').text('$' + total.toFixed(2));
            }

            $('.fine-checkbox').on('change', updateTotal);

            $('#payBtn').on('click', function () {
                const selected = $('.fine-checkbox:checked');
                if (!selected.length) return alert('Please select at least one fine to pay.');

                // Simulate payment flow - replace with API call
                alert('Payment processed for ' + selected.length + ' fine(s).');
                selected.closest('tr').remove();
                updateTotal();
            });

            updateTotal();
        });
    </script>
</body>

</html>
